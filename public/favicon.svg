<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background: deep terminal navy -->
  <rect width="64" height="64" rx="12" fill="#07090f"/>
  <!-- Accent border -->
  <rect x="1" y="1" width="62" height="62" rx="11" stroke="#34d98a" stroke-opacity="0.35" stroke-width="1"/>
  <!-- R (left) -->
  <path d="M14 16 L14 48 M14 16 L26 16 Q32 16 32 24 Q32 32 26 32 L14 32 M26 32 L32 48"
        stroke="#34d98a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- D (right) -->
  <path d="M38 16 L38 48 L46 48 Q54 48 54 32 Q54 16 46 16 L38 16 Z"
        stroke="#3b9eff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Status dot (small green LED) -->
  <circle cx="55" cy="55" r="3" fill="#34d98a">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
