<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Real Deal — Real Estate Deal Analyzer for Investors</title>
    <meta name="description" content="Analyze fix & flip, BRRRR, and multifamily real estate deals in minutes. Get instant ARV estimates, profit margins, cap rates, deal scores, and a plain-English Go/No-Go verdict. Free to use." />

    <meta name="author" content="Real Deal" />
    <link rel="canonical" href="https://realdealestate.app/" />

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://realdealestate.app/" />
    <meta property="og:title" content="Real Deal — Know if it's a real deal. In minutes." />
    <meta property="og:description" content="Stop wasting hours on spreadsheets. Get instant property evaluation — ARV estimate, full cost breakdown, and a plain-English Go/No-Go verdict. Free for real estate investors." />

    <meta property="og:site_name" content="Real Deal" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://realdealestate.app/" />
    <meta name="twitter:title" content="Real Deal — Real Estate Deal Analyzer" />
    <meta name="twitter:description" content="Analyze fix & flip, BRRRR, and multifamily deals in minutes. Free ARV estimates, profit margins, deal scores, and Go/No-Go verdicts for real estate investors." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

      "name": "Real Deal",
      "url": "https://realdealestate.app",
      "description": "Real estate deal analysis platform for fix & flip, BRRRR, and multifamily investors",

      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#07090f" />
    <meta name="mobile-web-app-capable" content="yes" />
